---
name: Test

on: pull_request

jobs:
  dnscontrol:
    name: DNSControl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check
        uses: HisokaLabs/dnscontrol-actions
        with:
          args: check

      - name: Preview
        uses: HisokaLabs/dnscontrol-actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          args: preview
